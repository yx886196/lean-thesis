name: Build blueprint

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download mathlib cache
        run: lake exe cache get

      - name: Build Lean project
        run: lake build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install blueprint tooling
        run: |
          pip install leanblueprint
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Patch plastexdepgraph
        run: |
          python - <<'EOF'
          import pathlib
          import plastexdepgraph

          p = pathlib.Path(plastexdepgraph.__file__).parent / "Packages" / "depgraph.py"
          s = p.read_text()
          old = "    graph.nodes = set(nodes)"
          new = (
              "    for _n in nodes:\n"
              "        if type(_n).__hash__ is None:\n"
              "            type(_n).__hash__ = object.__hash__\n"
              "    graph.nodes = set(nodes)"
          )
          if old in s:
              p.write_text(s.replace(old, new))
              print("patched plastexdepgraph")
          EOF

      - name: Build blueprint (web)
        run: leanblueprint web
        env:
          TEXINPUTS: ".:"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
